version: 2

sources:
  - name: olist_bronze
    description: "Raw Olist e-commerce data loaded into Databricks Bronze layer."

    database: e-commerce_olist
    schema: bronze_data

    tables:

      # -------------------------
      # CUSTOMERS
      # -------------------------
      - name: olist_customers_dataset
        description: "Raw Olist customer data."

        columns:
          - name: customer_id
            tests:
              - not_null
              - unique

          - name: customer_unique_id
            tests:
              - not_null

      # -------------------------
      # ORDERS
      # -------------------------
      - name: olist_orders_dataset
        description: "Raw Olist order data."

        columns:
          - name: order_id
            tests:
              - not_null
              - unique

          - name: customer_id
            tests:
              - not_null

          - name: order_status
            tests:
              - not_null
              - accepted_values:
                  values:
                    - delivered
                    - shipped
                    - canceled
                    - invoiced
                    - processing
                    - unavailable
                    - approved
                    - created

      # -------------------------
      # ORDER ITEMS
      # -------------------------
      - name: olist_order_items_dataset
        description: "Raw Olist order item data."

        columns:
          - name: order_id
            tests:
              - not_null

          - name: order_item_id
            tests:
              - not_null

          - name: product_id
            tests:
              - not_null

          - name: seller_id
            tests:
              - not_null

      # -------------------------
      # ORDER PAYMENTS
      # -------------------------
      - name: olist_order_payments_dataset
        description: "Raw Olist payment data."

        columns:
          - name: order_id
            tests:
              - not_null

          - name: payment_type
            tests:
              - not_null

          - name: payment_value
            tests:
              - not_null

      # -------------------------
      # PRODUCTS
      # -------------------------
      - name: olist_products_dataset
        description: "Raw Olist product data."

        columns:
          - name: product_id
            tests:
              - not_null
              - unique

      # -------------------------
      # SELLERS
      # -------------------------
      - name: olist_sellers_dataset
        description: "Raw Olist seller data."

        columns:
          - name: seller_id
            tests:
              - not_null
              - unique

      # -------------------------
      # REVIEWS
      # -------------------------
      - name: olist_order_reviews_dataset
        description: "Raw Olist order review data."

        columns:
          - name: review_id
            tests:
              - not_null

          - name: order_id
            tests:
              - not_null

      # -------------------------
      # GEOLOCATION
      # -------------------------
      - name: olist_geolocation_dataset
        description: "Raw Brazilian geolocation data."

        columns:
          - name: geolocation_zip_code_prefix
            tests:
              - not_null

      # -------------------------
      # CATEGORY TRANSLATION
      # -------------------------
      - name: product_category_name_translation
        description: "Portuguese to English product category translation."

        columns:
          - name: product_category_name
            tests:
              - not_null

          - name: product_category_name_english
            tests:
              - not_null