version: 2

models:

  - name: dim_customers
    description: "Customer dimension."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

      - name: customer_unique_id
        tests:
          - not_null

  - name: dim_products
    description: "Product dimension with translated categories."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: dim_sellers
    description: "Seller dimension."
    columns:
      - name: seller_id
        tests:
          - not_null
          - unique

  - name: dim_date
    description: "Calendar dimension."
    columns:
      - name: date
        tests:
          - not_null
          - unique

  - name: fact_orders
    description: "Order-level business fact table."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null

  - name: fact_order_items
    description: "Order-item-level sales fact table."
    columns:
      - name: order_id
        tests:
          - not_null

      - name: order_item_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

      - name: seller_id
        tests:
          - not_null

      - name: price
        tests:
          - not_null

  - name: fact_payments
    description: "Payment-level fact table."
    columns:
      - name: order_id
        tests:
          - not_null

      - name: payment_type
        tests:
          - not_null

      - name: payment_value
        tests:
          - not_null

  - name: fact_reviews
    description: "Customer review fact table."
    columns:
      - name: review_id
        tests:
          - not_null

      - name: order_id
        tests:
          - not_null

      - name: review_score
        tests:
          - not_null