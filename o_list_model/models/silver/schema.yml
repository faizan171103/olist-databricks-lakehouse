version: 2

models:

  - name: stg_customers
    description: "Cleaned customer data."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

      - name: customer_unique_id
        tests:
          - not_null

  - name: stg_orders
    description: "Cleaned order-level data."
    columns:
      - name: order_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null

      - name: order_status
        tests:
          - not_null
          - accepted_values:
              values:
                - delivered
                - shipped
                - canceled
                - invoiced
                - processing
                - unavailable
                - approved
                - created

  - name: stg_order_items
    description: "Cleaned order item data."
    columns:
      - name: order_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

      - name: seller_id
        tests:
          - not_null

      - name: price
        tests:
          - not_null

  - name: stg_order_payments
    description: "Cleaned payment data."
    columns:
      - name: order_id
        tests:
          - not_null

      - name: payment_type
        tests:
          - not_null

      - name: payment_value
        tests:
          - not_null

  - name: stg_products
    description: "Cleaned product data."
    columns:
      - name: product_id
        tests:
          - not_null
          - unique

  - name: stg_sellers
    description: "Cleaned seller data."
    columns:
      - name: seller_id
        tests:
          - not_null
          - unique

  - name: stg_order_reviews
    description: "Cleaned and validated order review data."
    columns:
      - name: review_id
        tests:
          - not_null

      - name: order_id
        tests:
          - not_null

      - name: review_score
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: stg_geolocation
    description: "Cleaned Brazilian geolocation data."
    columns:
      - name: geolocation_zip_code_prefix
        tests:
          - not_null

  - name: stg_category_translation
    description: "Portuguese to English product category translation."
    columns:
      - name: product_category_name
        tests:
          - not_null

      - name: product_category_name_english
        tests:
          - not_null